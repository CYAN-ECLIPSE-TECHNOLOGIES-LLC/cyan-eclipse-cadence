# Cyan Eclipse Cadence - rule set v1 (14 rules, R1-R14)
# Each rule cites its corpus source verbatim (author, year, chapter/section).
# Design of record: White Report voice-humanization report (2026-11-09), section 4.4.
# Parsed with Python stdlib only (cadence/rules.py minimal YAML-subset parser).
rule_set: rules-v1
version: 1
parameters:
  pause_breath_seconds: 0.35
  pause_emphasis_seconds: 0.70
  pause_act_boundary_seconds: 0.90
  pause_none_seconds: 0.0
  tempo_min: 0.88
  tempo_max: 1.12
  tempo_hook: 1.00
  tempo_evidence: 1.05
  tempo_turn: 0.95
  tempo_payoff: 0.92
  emphasis_pause_budget_per_minute: 6
  breath_group_max_words: 14
  circumflex_max_per_episode: 1
rules:
  - id: R1
    name: "Breath-group chunking; pauses only at group boundaries"
    citation: "Carnegie & Esenwein, 1915, Ch. VI"
    realisation: "Synthesis-call granularity is the breath-group; pauses land at cluster boundaries only, never mid-cluster."
    parameters: "max_words_per_group 14; groups built on sentence ends then clause marks"
  - id: R2
    name: "Three pause classes; emphasis pauses only before marked peaks; budget/min"
    citation: "Carnegie & Esenwein, 1915, Ch. VI; Sanders, 1863, section V; Everts, 1911"
    realisation: "Join-gap map by pause class (breath 0.35s, emphasis 0.70s, act-boundary 0.90s, none 0.0s); the legacy flat join gap is abolished; author token || inserts a rhetorical emphasis pause."
    parameters: "emphasis_pause_budget_per_minute 6; emphasis pauses only before a marked peak"
  - id: R3
    name: "One peak per sentence, 3 graded tiers"
    citation: "Carnegie & Esenwein, 1915, Ch. III; Sanders, 1863, section II"
    realisation: "Graded typography tiers in the encoded call text (tier 1 plain, tier 2 italic markup, tier 3 capitals) plus post level/glide emphasis in later milestones."
    parameters: "tiers 1-3; author markup wins over the default last-content-word peak"
  - id: R4
    name: "Subordination dip on function/stock spans"
    citation: "Carnegie & Esenwein, 1915, Ch. III"
    realisation: "Function-word-heavy short spans are compiled with intensity reduced (submerged like stream-beds) so peaks are made by dipping the rest."
    parameters: "short group at most 6 words with function-word ratio at least 0.5 compiles to reduced"
  - id: R5
    name: "Pitch-base shift at every thought boundary"
    citation: "Carnegie & Esenwein, 1915, Ch. IV"
    realisation: "Segment split plus register step between calls; same pitch across a thought change is a measured defect in later milestones."
    parameters: "one register step per act boundary in v0.1 (labels only)"
  - id: R6
    name: "Contour by clause function (Q type, alternatives)"
    citation: "Sanders, 1863, Rules I-III"
    realisation: "Contour tag per span from clause function (yes/no questions rise, wh- questions fall, declaratives fall) via punctuation engineering in the encoded text."
    parameters: "question-final span rise unless the sentence opens with a wh- word, then fall"
  - id: R7
    name: "Antithesis mirroring"
    citation: "Sanders, 1863, Rule IV"
    realisation: "Paired contrast clauses (X; not Y / held; didn't patterns) receive mirrored contours: former limb rising, latter falling; a semicolon is a hard breath-group boundary."
    parameters: "first limb rise, second limb fall"
  - id: R8
    name: "Series rule: hold-rise, penultimate rise, final fall"
    citation: "Sanders, 1863, Rules V + VII"
    realisation: "List-span directives: non-final items hold-rise, the penultimate span rises distinctly, the final span falls and closes."
    parameters: "series means at least 2 commas in one sentence"
  - id: R9
    name: "Circumflex rationed to irony/condition"
    citation: "Sanders, 1863"
    realisation: "A single-word fall-rise glide class, rationed; overuse is flagged by the compiler in later milestones."
    parameters: "circumflex_max_per_episode 1"
  - id: R10
    name: "Register per act (medium/raised/lowered base)"
    citation: "Southwick, 1908"
    realisation: "Register label per act in the score (hook medium, evidence medium, turn raised, payoff lowered); voice-catalog register variants and post shaping are later milestones."
    parameters: "labels only in v0.1"
  - id: R11
    name: "Tempo by thought weight (slow the peak, skim the transition)"
    citation: "Carnegie & Esenwein, 1915, Ch. V"
    realisation: "Per-unit tempo map by act, replacing the legacy global post-hoc tempo crush."
    parameters: "tempo bounds 0.88 to 1.12; defaults hook 1.00, evidence 1.05, turn 0.95, payoff 0.92"
  - id: R12
    name: "Inverse intensity at climax (quieter + closer)"
    citation: "Delaumosne et al., 1893, Rules for Intensity of Sound"
    realisation: "The payoff act's final sentence compiles to intensity climax-quiet; mix automation (climax level down, bed duck deepens) is a later milestone."
    parameters: "applies to the final sentence of the payoff act only"
  - id: R13
    name: "Arc: conversational open, build, release"
    citation: "Pittenger, 1868"
    realisation: "Act-level register and intensity envelope across the score: conversational hook, building evidence and turn, released payoff."
    parameters: "envelope realised through R10 register labels and R12 in v0.1"
  - id: R14
    name: "Listen-back gate: no render ships unmeasured/unheard"
    citation: "Delaumosne et al., 1893; Pittenger, 1868"
    realisation: "Acceptance gate plus whole-take review step; in v0.1 the gate is the rule-set validation and the compiler test suite (no audio exists yet)."
    parameters: "gate enforcement lands with the measurer in a later milestone"
